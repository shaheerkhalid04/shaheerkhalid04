name: actions-alive

# GitHub disables scheduled workflows in a repository after 60 days without
# activity, which silently stops every cron job you own. This sweeps them weekly
# and switches back on anything disabled for inactivity.
#
# With the KEEPALIVE_TOKEN secret set (a personal access token carrying repo and
# workflow scope) the sweep covers every repository you own. Without it, the
# built-in token can still reach this one, so the keep-alive cron protects
# itself either way.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Re-enable every workflow disabled for inactivity
        env:
          USER_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SELF: ${{ github.repository }}
        run: |
          if [ -n "$USER_TOKEN" ]; then
            export GH_TOKEN="$USER_TOKEN"
            repos="$(gh repo list "$OWNER" --limit 200 --no-archived --json nameWithOwner --jq '.[].nameWithOwner')"
          else
            export GH_TOKEN="$FALLBACK_TOKEN"
            repos="$SELF"
            {
              echo "No KEEPALIVE_TOKEN secret, so only \`$SELF\` was swept."
              echo "Add a personal access token with repo + workflow scope to cover every repository."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          revived=0
          for repo in $repos; do
            ids="$(gh api "repos/$repo/actions/workflows" --jq '.workflows[] | select(.state == "disabled_inactivity") | .id' 2>/dev/null || true)"
            for id in $ids; do
              name="$(gh api "repos/$repo/actions/workflows/$id" --jq '.name')"
              echo "re-enabling $repo :: $name"
              gh api -X PUT "repos/$repo/actions/workflows/$id/enable"
              revived=$((revived + 1))
            done
          done

          echo "Re-enabled $revived workflow(s)." | tee -a "$GITHUB_STEP_SUMMARY"
